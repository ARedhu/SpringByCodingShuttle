spring.application.name=prod-ready-features
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/prod_ready_features?allowPublicKeyRetrieval=true&useSSL=false
# useSSL=true in production
spring.datasource.username=AshuGolu
spring.datasource.password=Ashu@Golu1

# port where our current application is running.
server.port = 9000

employeeService.base.url = http://localhost:8080/


#Logging configuration
# Now for the folder/package "clients" will have logs till "DEBUG"
logging.level.com/codingShuttle/Ashish/prod_ready_features/clients=TRACE

#logging.leve.root=DEBUG #But we prefer to not set it to debug for memory and performance constraints.
logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] [%c{2.}] --- %m%n
#logging.file.name=application.log
logging.config=classpath:logback-spring.xml


# Spring Boot Actuators.
#management.endpoints.web.exposure.include=* // Here we exposed all the endpoints but it is not preferred. By defualt spring expose only health endpoint and hide many points because they contains sensitive info like environment variables and beans info.
# Below we are exposing only a few endpoints.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# To add something inside of info endpoint.
management.info.env.enabled=true

info.app.name=SpringBoot Learning
info.app.version=1.0.0
info.app.description=Learning Spring Boot Actuator
info.app.author=Ashish

